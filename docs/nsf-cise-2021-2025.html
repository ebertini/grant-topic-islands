<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant Topic Islands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    --surface-1:#fcfcfb; --surface-2:#f0efec; --text-primary:#0b0b0b;
    --text-secondary:#52514e; --text-muted:#8a8a83; --hairline:#e3e2dd;
    --nsf:#2a78d6; --nih:#008300; --other:#eda100; --accent:#2a78d6; --hull:#e6ebf2;
    --kw-blue:#5079a8; --kw-gray:#93938c;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--surface-1); overflow:hidden;
    font-family:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text-primary); }
  #app { display:grid; grid-template-columns:1fr 320px; grid-template-rows:48px 1fr; height:100%; }
  header { grid-column:1/3; display:flex; align-items:center; gap:14px; padding:0 16px;
    border-bottom:1px solid var(--hairline); }
  header h1 { font-size:15px; font-weight:600; margin:0; white-space:nowrap; }
  #crumbs { font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
  #crumbs .c { cursor:pointer; color:var(--accent); }
  #crumbs .c.here { color:var(--text-primary); cursor:default; font-weight:600; }
  #crumbs .sep { color:var(--text-muted); }
  .controls { margin-left:auto; display:flex; align-items:center; gap:8px; }
  #datasetLabel { font-size:12.5px; color:var(--text-muted); white-space:nowrap; }
  .btn { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--hairline);
    background:var(--surface-1); border-radius:6px; cursor:pointer; color:var(--text-secondary); }
  .btn:hover { border-color:var(--text-muted); }
  .btn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #stage { grid-column:1; grid-row:2; position:relative; overflow:hidden;
    background:radial-gradient(125% 105% at 50% 38%, #ffffff 0%, #f1f0ec 100%); }
  svg { width:100%; height:100%; display:block; cursor:grab; }
  svg:active { cursor:grabbing; }
  .hull { fill:var(--hull); fill-opacity:.6; stroke:var(--hairline); stroke-width:1; }
  .hull.drill { cursor:pointer; }
  .hull.drill:hover { fill-opacity:.85; }
  .group-title { text-anchor:middle; font-weight:700; fill:var(--text-primary);
    paint-order:stroke; stroke:var(--surface-1); stroke-width:3.5px; }
  .group-title.drill { cursor:pointer; }
  .group-title.drill:hover { fill:var(--accent); }
  .kw-g { cursor:pointer; }
  .kw-card { fill:#fff; stroke:transparent; stroke-width:1.3px; }
  .kw-g:hover .kw-card { stroke:var(--accent); }
  .kw-g:hover .kw-text { fill:var(--accent); }
  .kw-g.sel .kw-card { stroke:var(--accent); }
  .kw-g.sel .kw-text { fill:var(--accent); font-weight:700; }
  .kw-text { text-anchor:middle; dominant-baseline:central; }
  .pager-label { fill:var(--text-muted); }
  .pager-btn { cursor:pointer; }
  .pager-btn circle { fill:var(--surface-2); stroke:var(--hairline); stroke-width:1; }
  .pager-btn text { fill:var(--text-secondary); }
  .pager-btn:hover circle { stroke:var(--accent); }
  .pager-btn:hover text { fill:var(--accent); }
  .pager-btn.disabled { cursor:default; opacity:.3; }
  .spark-bg { fill:var(--accent); opacity:0; }
  .kw-g:hover .spark-bg, .kw-g.sel .spark-bg { opacity:.08; }
  #timelineLegend { display:none; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); }
  #timelineLegend.on { display:flex; }
  #timelineLegend .ramp { width:70px; height:8px; border-radius:2px; }
  #panel { grid-column:2; grid-row:2; border-left:1px solid var(--hairline); background:var(--surface-1);
    padding:14px 16px; overflow-y:auto; font-size:13px; }
  #panel h2 { font-size:14px; margin:0 0 2px; }
  #panel .psub { color:var(--text-muted); font-size:12px; margin-bottom:12px; }
  #panel .grant { padding:8px 0; border-top:1px solid var(--hairline); }
  #panel .grant .hd { cursor:pointer; display:flex; align-items:baseline; }
  #panel .grant .cav { color:var(--text-muted); margin-right:5px; font-size:10px; }
  #panel .grant .t { font-weight:500; }
  #panel .grant .m { color:var(--text-muted); font-size:11px; margin-top:2px; }
  #panel .abs { margin-top:6px; font-size:12.5px; line-height:1.55; color:var(--text-secondary); }
  #panel .legend { display:flex; gap:14px; align-items:center; font-size:11px; color:var(--text-muted); margin:2px 0 12px; }
  #panel .kw-hit { background:#e7edf5; color:#3a5a82; border-radius:2px; padding:0 2px; }
  #panel .kw-sel { background:#5079a8; color:#fff; border-radius:2px; padding:0 2px; font-weight:600; }
  #panel .empty { color:var(--text-muted); }
  #tooltip { position:absolute; pointer-events:none; background:#111; color:#fff; font-size:12px;
    padding:6px 8px; border-radius:5px; opacity:0; transform:translate(-50%,-130%); white-space:nowrap; z-index:10; }
  #hint { position:absolute; left:12px; bottom:10px; font-size:11px; color:var(--text-muted);
    background:var(--surface-1); padding:4px 8px; border:1px solid var(--hairline); border-radius:6px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Grant Topic Islands</h1>
    <span id="datasetLabel"></span>
    <nav id="crumbs"></nav>
    <div class="controls">
      <button id="scaleFreqBtn" class="btn on">Scale by frequency</button>
      <button id="gridBtn" class="btn">Grid layout</button>
      <div id="timelineLegend"><span id="legendLo"></span><span class="ramp"></span><span id="legendHi"></span></div>
      <button id="timelineBtn" class="btn">Show timeline</button>
    </div>
  </header>
  <div id="stage">
    <svg id="svg"></svg>
    <div id="tooltip"></div>
    <div id="hint">click a topic to open its subtopics · click empty space to go back · scroll to zoom</div>
  </div>
  <aside id="panel"><div class="empty">Click a keyphrase to see the grants it appears in.</div></aside>
</div>

<script type="module">
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const DATA_DIR=".";   // swapped to "." by the docs/ deploy build
// ENTRY picks which dataset THIS page shows — each deployed page is single-dataset
// (see pipeline/publish_docs.py, which generates one HTML file per dataset by
// substituting this line). Local dev default: the Northeastern awards dataset.
const ENTRY={"id": "nsf-cise-21-25", "label": "NSF CISE 2021–2025", "file": "datasets/nsf-cise-21-25.json", "excluded_years": [2020, 2026]};

// ---- dataset-dependent state — (re)assigned by loadDataset() on load/switch ----
let data, docs, topicById;
let EXCLUDED_YEARS, YEARS;
let histCache;
let GLOBAL_MAX_COUNT;

// per-keyword per-year histogram, cached
function yearHist(k){
  if(histCache.has(k.text)) return histCache.get(k.text);
  const counts=new Map(YEARS.map(y=>[y,0]));
  (k.docs||[]).forEach(id=>{const d=docs[id]; if(d&&d.year&&counts.has(d.year)) counts.set(d.year,counts.get(d.year)+1);});
  const arr=YEARS.map(y=>({year:y,count:counts.get(y)||0}));
  histCache.set(k.text,arr);
  return arr;
}

// Viridis, reversed so darker = higher count (its native direction runs dark-low/bright-high).
// LIGHT_FLOOR keeps any nonzero count from fading near-white, so it doesn't read as the
// true-empty (zero-grant) tile, which is drawn as a flat neutral gray instead of a scale color.
const LIGHT_FLOOR=0.16;
function scaleAt(t){
  const tt=LIGHT_FLOOR+(1-LIGHT_FLOOR)*Math.max(0,Math.min(1,t));
  return d3.interpolateViridis(1-tt);
}
const countColor=count=>count>0?scaleAt(count/GLOBAL_MAX_COUNT):"var(--hairline)";

let showTimeline=false;
let gridLayout=false;
const SPARK_W=130, SPARK_H=12, SPARK_GAP=4, SPARK_CELL_GAP=0.6;

// "Scale by frequency": term font size encodes doc_freq on ONE global scale (built from every
// keyword in the dataset — top-level AND subtopic-level share the same pool of keyword objects
// and the same domain), so a card's size means the same grant count everywhere: comparable
// across topics, and just as active when drilled into a single subtopic.
let scaleByFreq=true;
const MIN_FS=9, MAX_FS=64;
// exponent < 0.5 (vs. a plain sqrt scale) spreads out the low/mid end more aggressively, so
// differences stay visible for subtopic-level terms whose counts are far below the dataset's
// single biggest keyword, not just for the handful of terms near the global max.
let GLOBAL_MAX_DOC_FREQ, fsScale;
const fsFor=k=>scaleByFreq?fsScale(k.doc_freq):KW_FS;

// every keyphrase used in the visualization -> regex, for highlighting inside abstracts
let allKw, KW_RE;
const escapeRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const highlightAbstract=(text,sel)=>esc(text).replace(KW_RE,
  m=>`<mark class="${m.toLowerCase()===sel?"kw-sel":"kw-hit"}">${m}</mark>`);

const W=1600,H=1000,MARGIN=180;
const sx=d3.scaleLinear([0,1],[MARGIN,W-MARGIN]);
const sy=d3.scaleLinear([0,1],[MARGIN,H-MARGIN]);
const KW_FS=18;         // uniform keyphrase size (coverage is too flat across terms to scale by)
const PAGE_SIZE=5;      // keyphrases shown at once per group; the rest are paged through
const ROW_GAP=4, PAGER_GAP=8, PAGER_H=20, PAGER_BTN_R=9;

const measure=document.createElement("canvas").getContext("2d");
const PADX=10, PADY=5.5, RX=4;
const cardBox=(t,fs)=>{measure.font=`600 ${fs}px "Fira Sans",sans-serif`;
  return {w:measure.measureText(t).width+2*PADX, h:fs+2*PADY};};

const svg=d3.select("#svg").attr("viewBox",[0,0,W,H]);
const vp=svg.append("g");
const gTitle=vp.append("g"), gNode=vp.append("g"), gPager=vp.append("g");
const defs=svg.append("defs");
defs.append("filter").attr("id","cardShadow").attr("x","-40%").attr("y","-40%").attr("width","180%").attr("height","180%")
  .append("feDropShadow").attr("dx",0).attr("dy",1.2).attr("stdDeviation",2.4).attr("flood-color","#2a2a28").attr("flood-opacity",0.16);
defs.append("filter").attr("id","cardShadowHi").attr("x","-60%").attr("y","-60%").attr("width","220%").attr("height","220%")
  .append("feDropShadow").attr("dx",0).attr("dy",3).attr("stdDeviation",5).attr("flood-color","#2a2a28").attr("flood-opacity",0.2);
const zoom=d3.zoom().scaleExtent([0.3,8]).on("zoom",e=>vp.attr("transform",e.transform));
svg.call(zoom);
svg.on("click",()=>goUp());

let path=[];              // [] overview (topics) | [topicId] (subtopics of a topic)
let selectedEl=null, selKwText=null;
const pageOf=new Map();   // group id -> current page index (persists while the app is open)

/* ---------- keyphrase selection per group (FULL sorted list; paging slices it) ---------- */
const topicKwsFull=t=>{
  const m=new Map();
  t.subtopics.forEach(s=>s.keywords.forEach(k=>{ if(!m.has(k.text)||k.doc_freq>m.get(k.text).doc_freq) m.set(k.text,k); }));
  return [...m.values()].sort((a,b)=>b.doc_freq-a.doc_freq);
};
const subKwsFull=s=>[...s.keywords].sort((a,b)=>b.doc_freq-a.doc_freq);

/* ---------- local layout of one keyphrase cloud around (0,0) ---------- */
// vertical centered stack of the current page's cards, plus a reserved pager row.
// Width/height are sized from the FULL list (not just the visible page), so a
// group's footprint never changes when paging -> neighbors never have to re-simulate.
// Order is always by doc_freq (set by topicKwsFull/subKwsFull) — the timeline adds a sparkline
// per row, it doesn't change which terms rank where.
function layoutStack(fullSorted,page){
  const total=fullSorted.length;
  const pageCount=Math.max(1,Math.ceil(total/PAGE_SIZE));
  page=Math.max(0,Math.min(page,pageCount-1));
  const visible=fullSorted.slice(page*PAGE_SIZE,page*PAGE_SIZE+PAGE_SIZE);
  const nodes=visible.map(k=>{const fs=fsFor(k); return {k,label:k.text,fs,funder:k.funder,box:cardBox(k.text,fs),
    hist:showTimeline?yearHist(k):null};});
  // Row slot height is reserved from THIS group's own largest card (fullSorted[0], since the list
  // is doc_freq-sorted — the biggest card, scaled or not, is always first), not the global max —
  // otherwise every group would waste space to match the single most-frequent term anywhere.
  const maxFsHere=fullSorted.length?fsFor(fullSorted[0]):KW_FS;
  // row reserves extra height for the sparkline (+gap) when the timeline is on, and rows get
  // more breathing room so it stays unambiguous which sparkline belongs to which term.
  const rowH=maxFsHere+2*PADY+(showTimeline?SPARK_GAP+SPARK_H:0);
  const rowGap=showTimeline?16:ROW_GAP;
  const stackH=PAGE_SIZE*rowH+(PAGE_SIZE-1)*rowGap;          // reserved for a full page
  const hasPager=total>PAGE_SIZE;
  const height=stackH+(hasPager?PAGER_GAP+PAGER_H:0);
  const top=-height/2;
  nodes.forEach((n,i)=>{ n.x=0; n.y=top+i*(rowH+rowGap)+rowH/2; });
  const width=fullSorted.length
    ?Math.max(showTimeline?SPARK_W:0,...fullSorted.map(k=>cardBox(k.text,fsFor(k)).w)):0;
  const pagerY=top+stackH+PAGER_GAP+PAGER_H/2;
  return {nodes,width,height,total,page,pageCount,hasPager,pagerY};
}

/* ---------- build groups for the current level ---------- */
function buildGroups(){
  if(path.length===0)
    return data.topics.map(t=>({id:t.id,title:t.llm_label,funder:Object.keys(t.funder_mix)[0],
      seed:t.seed,cloud:layoutStack(topicKwsFull(t),pageOf.get(t.id)||0),drill:true}));
  const t=topicById.get(path[0]);
  return t.subtopics.map(s=>({id:s.id,title:s.llm_label,funder:Object.keys(s.funder_mix)[0],
    cloud:layoutStack(subKwsFull(s),pageOf.get(s.id)||0),drill:false}));
}

/* ---------- position the groups, then place keyphrases absolutely ---------- */
// Row-wise grid: islands keep their natural (data) order, laid out left-to-right/top-to-bottom.
// Column widths and row heights are each sized to their largest member, so every island in a
// column shares the same horizontal center and every island in a row shares the same vertical
// band — real alignment, not just a uniform-cell approximation.
function gridArrange(groups){
  const GAP=40;
  const n=groups.length;
  const cols=Math.max(1,Math.round(Math.sqrt(n*(W/H))));
  const rows=Math.ceil(n/cols);
  groups.forEach(g=>{ g.gw=g.cloud.width+40; g.gh=g.cloud.height+80; });   // +title & breathing room
  const colW=new Array(cols).fill(0), rowH=new Array(rows).fill(0);
  groups.forEach((g,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    colW[c]=Math.max(colW[c],g.gw);
    rowH[r]=Math.max(rowH[r],g.gh);
  });
  const colX=[0]; for(let c=1;c<cols;c++) colX.push(colX[c-1]+colW[c-1]+GAP);
  const rowY=[0]; for(let r=1;r<rows;r++) rowY.push(rowY[r-1]+rowH[r-1]+GAP);
  groups.forEach((g,i)=>{
    const c=i%cols, r=Math.floor(i/cols);
    g.x=colX[c]+colW[c]/2;
    g.y=rowY[r]+rowH[r]/2;
  });
}

function positionGroups(groups){
  groups.forEach(g=>g.r=0.5*Math.hypot(g.cloud.width,g.cloud.height)+22);   // +space for the title
  if(gridLayout){
    gridArrange(groups);
  } else if(path.length===0){
    groups.forEach(g=>{g.x=sx(g.seed[0]);g.y=sy(g.seed[1]);});
    const sim=d3.forceSimulation(groups)
      .force("x",d3.forceX(g=>sx(g.seed[0])).strength(.12))
      .force("y",d3.forceY(g=>sy(g.seed[1])).strength(.12))
      .force("collide",d3.forceCollide(g=>g.r+16).strength(.95)).stop();
    for(let i=0;i<300;i++)sim.tick();
  } else {
    groups.forEach((g,i)=>{const a=i*2.39996,rr=30+16*Math.sqrt(i);g.x=W/2+rr*Math.cos(a);g.y=H/2+rr*Math.sin(a);});
    const sim=d3.forceSimulation(groups)
      .force("center",d3.forceCenter(W/2,H/2)).force("charge",d3.forceManyBody().strength(-60))
      .force("collide",d3.forceCollide(g=>g.r+18).strength(.95)).stop();
    for(let i=0;i<300;i++)sim.tick();
  }
  groups.forEach(g=>g.cloud.nodes.forEach(n=>{n.ax=g.x+n.x;n.ay=g.y+n.y;}));
}

/* ---------- render ---------- */
function render(refit=true){
  const groups=buildGroups();
  positionGroups(groups);
  drawTitles(groups); drawKeyphrases(groups); drawPagers(groups); drawCrumbs();
  gTitle.style("opacity",0).transition().duration(300).style("opacity",1);
  gNode.style("opacity",0).transition().duration(300).style("opacity",1);
  gPager.style("opacity",0).transition().duration(300).style("opacity",1);
  if(refit) fit(groups);   // only re-fit the viewport on level changes, not on a page turn
}

function drawTitles(groups){
  gTitle.selectAll("*").remove();
  groups.forEach(g=>{
    const t=gTitle.append("text").attr("class","group-title"+(g.drill?" drill":""))
      .attr("x",g.x).attr("y",g.y-g.cloud.height/2-14).attr("font-size",path.length===0?24:22)
      .text(g.title);
    if(g.drill) t.on("click",e=>{e.stopPropagation();path=[g.id];selectedEl=null;render();});
  });
}

function drawKeyphrases(groups){
  const nodes=groups.flatMap(g=>g.cloud.nodes);
  gNode.selectAll("g.kw-g").remove();
  const g=gNode.selectAll("g.kw-g").data(nodes).join("g").attr("class","kw-g")
    .attr("transform",n=>`translate(${n.ax},${n.ay})`)
    .on("mouseover",(e,n)=>tip(e,`${n.label} · ${n.k.doc_freq} grants · ${n.funder}`))
    .on("mousemove",(e,n)=>tip(e,`${n.label} · ${n.k.doc_freq} grants · ${n.funder}`))
    .on("mouseout",hideTip)
    .on("click",(e,n)=>{e.stopPropagation();selectKw(n.k,e.currentTarget);});
  g.append("rect").attr("class","kw-card")
    .attr("x",n=>-n.box.w/2).attr("y",n=>-n.box.h/2)
    .attr("width",n=>n.box.w).attr("height",n=>n.box.h).attr("rx",RX).attr("ry",RX)
    .attr("filter","url(#cardShadow)");
  g.append("text").attr("class","kw-text").attr("font-size",n=>n.fs)
    .attr("font-weight",600).style("fill","var(--kw-blue)")
    .text(n=>n.label);

  if(showTimeline){
    g.each(function(n){
      const sel=d3.select(this);
      const sg=sel.append("g").attr("class","spark")
        .attr("transform",`translate(${-SPARK_W/2},${n.box.h/2+SPARK_GAP})`);
      const cw=SPARK_W/n.hist.length;
      sg.append("rect").attr("class","spark-bg")
        .attr("x",-4).attr("y",-3).attr("width",SPARK_W+8).attr("height",SPARK_H+6).attr("rx",3);
      sg.selectAll("rect.spark-cell").data(n.hist).join("rect")
        .attr("class","spark-cell")
        .attr("x",(d,i)=>i*cw+SPARK_CELL_GAP/2)
        .attr("width",Math.max(0.4,cw-SPARK_CELL_GAP))
        .attr("y",0).attr("height",SPARK_H)
        .attr("fill",d=>countColor(d.count))
        .on("mouseover",(e,d)=>{ e.stopPropagation(); tip(e,`${n.label} · ${d.year} · ${d.count} grant${d.count===1?"":"s"}`); })
        .on("mousemove",(e,d)=>{ e.stopPropagation(); tip(e,`${n.label} · ${d.year} · ${d.count} grant${d.count===1?"":"s"}`); })
        .on("mouseout",()=>hideTip());
    });
  }
}

// prev/next chevrons + an "x–y of N" counter, shown only when a group has more
// keyphrases than fit on one page. Sorted by coverage (doc_freq), same order as the cards.
function drawPagers(groups){
  gPager.selectAll("*").remove();
  const withPager=groups.filter(g=>g.cloud.hasPager);
  const rows=gPager.selectAll("g.pager").data(withPager,g=>g.id).join("g")
    .attr("class","pager")
    .attr("transform",g=>`translate(${g.x},${g.y+g.cloud.pagerY})`);

  rows.each(function(g){
    const row=d3.select(this);
    const {page,pageCount,total}=g.cloud;
    const start=page*PAGE_SIZE+1, end=Math.min(total,start+PAGE_SIZE-1);
    measure.font=`500 11px "Fira Sans",sans-serif`;
    const label=`${start}–${end} of ${total}`;
    const halfW=measure.measureText(label).width/2+8+PAGER_BTN_R;

    row.append("text").attr("class","pager-label").attr("text-anchor","middle")
      .attr("dominant-baseline","central").attr("font-size",11).text(label);

    const mkBtn=(dx,glyph,enabled,onClick)=>{
      const btn=row.append("g").attr("class","pager-btn"+(enabled?"":" disabled"))
        .attr("transform",`translate(${dx},0)`);
      btn.append("circle").attr("r",PAGER_BTN_R);
      btn.append("text").attr("text-anchor","middle").attr("dominant-baseline","central")
        .attr("font-size",11).text(glyph);
      if(enabled) btn.on("click",e=>{e.stopPropagation();onClick();});
      return btn;
    };
    mkBtn(-halfW,"▲",page>0,()=>{pageOf.set(g.id,page-1);render(false);});
    mkBtn(halfW,"▼",page<pageCount-1,()=>{pageOf.set(g.id,page+1);render(false);});
  });
}

function fit(groups){
  const x0=d3.min(groups,g=>g.x-g.r), x1=d3.max(groups,g=>g.x+g.r);
  const y0=d3.min(groups,g=>g.y-g.r), y1=d3.max(groups,g=>g.y+g.r);
  const k=Math.min(W/(x1-x0),H/(y1-y0))*0.9;
  svg.transition().duration(450).call(zoom.transform,
    d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k));
}

function goUp(){ if(path.length){path=path.slice(0,-1);selectedEl=null;render();} }

function drawCrumbs(){
  const parts=[{label:"All Topics",path:[]}];
  if(path.length>=1) parts.push({label:topicById.get(path[0]).llm_label,path:[path[0]]});
  const nav=d3.select("#crumbs"); nav.selectAll("*").remove();
  parts.forEach((p,i)=>{
    if(i) nav.append("span").attr("class","sep").text("▸");
    nav.append("span").attr("class","c"+(i===parts.length-1?" here":""))
      .text(p.label).on("click",()=>{ if(i<parts.length-1){path=p.path;selectedEl=null;render();} });
  });
}

/* ---------- keyphrase drill-down ---------- */
const panel=document.getElementById("panel");
function selectKw(k,el){
  if(selectedEl) selectedEl.classList.remove("sel");
  selectedEl=el; el.classList.add("sel"); selKwText=k.text.toLowerCase();
  const grants=(k.docs||[]).map(id=>docs[id]).filter(Boolean).sort((a,b)=>(b.year||0)-(a.year||0)).slice(0,60);
  const legend=`<div class="legend">`+
    `<span><mark class="kw-sel">selected</mark> this term</span>`+
    `<span><mark class="kw-hit">other</mark> other keyphrases</span></div>`;
  panel.innerHTML=`<h2>${esc(k.text)}</h2>`+
    `<div class="psub">${k.doc_freq} grants${k.doc_freq>grants.length?` · showing ${grants.length}`:""}</div>`+
    (grants.length?legend+grants.map((g,i)=>
      `<div class="grant"><div class="hd" data-i="${i}"><span class="cav">▸</span>`+
      `<span class="t">${esc(g.title||"(untitled)")}</span></div>`+
      `<div class="m">${g.funder_code||"?"}${g.year?" · "+g.year:""}</div>`+
      `<div class="abs" hidden></div></div>`).join("")
     :`<div class="empty">No indexed grants.</div>`);
  panel.querySelectorAll(".grant .hd").forEach(hd=>{
    hd.onclick=()=>{
      const g=grants[+hd.dataset.i], row=hd.parentElement;
      const abs=row.querySelector(".abs"), cav=hd.querySelector(".cav");
      if(abs.hidden){
        if(!abs.dataset.done){ abs.innerHTML=highlightAbstract(g.abstract||"(no abstract available)",selKwText); abs.dataset.done="1"; }
        abs.hidden=false; cav.textContent="▾";
      } else { abs.hidden=true; cav.textContent="▸"; }
    };
  });
}

/* ---------- tooltip + controls ---------- */
const tt=document.getElementById("tooltip"), stage=document.getElementById("stage");
const tip=(e,text)=>{const r=stage.getBoundingClientRect();tt.style.left=(e.clientX-r.left)+"px";
  tt.style.top=(e.clientY-r.top)+"px";tt.textContent=text;tt.style.opacity=1;};
const hideTip=()=>tt.style.opacity=0;

function updateTimelineLegend(){
  document.getElementById("legendLo").textContent="0";
  document.getElementById("legendHi").textContent=GLOBAL_MAX_COUNT+"/yr";
  document.querySelector("#timelineLegend .ramp").style.background=
    `linear-gradient(to right, ${d3.range(0,1.0001,0.1).map(scaleAt).join(",")})`;
}

// Grid layout has no fixed canvas anchor (unlike the semantic map or the
// drilled-in radial view, both centered/bounded within the W×H canvas) — its
// total extent grows directly with card size, so it must refit whenever that
// size-affecting state changes underneath it, or the old viewport stops
// framing it (cards shift/clip off-screen). The anchored layouts don't have
// this problem, so they can safely keep the user's current pan/zoom.
const timelineBtn=document.getElementById("timelineBtn");
const timelineLegend=document.getElementById("timelineLegend");
timelineBtn.onclick=()=>{
  showTimeline=!showTimeline;
  timelineBtn.classList.toggle("on",showTimeline);
  timelineBtn.textContent=showTimeline?"Hide timeline":"Show timeline";
  timelineLegend.classList.toggle("on",showTimeline);
  render(gridLayout);
};

const scaleFreqBtn=document.getElementById("scaleFreqBtn");
scaleFreqBtn.onclick=()=>{
  scaleByFreq=!scaleByFreq;
  scaleFreqBtn.classList.toggle("on",scaleByFreq);
  render(gridLayout);
};

const gridBtn=document.getElementById("gridBtn");
gridBtn.onclick=()=>{
  gridLayout=!gridLayout;
  gridBtn.classList.toggle("on",gridLayout);
  render();   // always refit — switching layout mode changes the coordinate space
};

/* ---------- dataset loading + the live dataset switcher ---------- */
async function loadDataset(entry){
  data=await fetch(`${DATA_DIR}/${entry.file}`).then(r=>r.json());
  docs=data.docs||{};
  topicById=new Map(data.topics.map(t=>[t.id,t]));

  EXCLUDED_YEARS=new Set(entry.excluded_years||[]);
  const ys=Object.values(docs).map(d=>d.year).filter(Boolean);
  YEARS=d3.range(d3.min(ys),d3.max(ys)+1).filter(y=>!EXCLUDED_YEARS.has(y));
  histCache=new Map();

  let maxCount=0;
  data.topics.forEach(t=>t.subtopics.forEach(s=>s.keywords.forEach(k=>{
    const m=d3.max(yearHist(k),d=>d.count);
    if(m>maxCount) maxCount=m;
  })));
  GLOBAL_MAX_COUNT=maxCount||1;

  let maxDf=0;
  allKw=new Set();
  data.topics.forEach(t=>t.subtopics.forEach(s=>s.keywords.forEach(k=>{
    allKw.add(k.text);
    if(k.doc_freq>maxDf) maxDf=k.doc_freq;
  })));
  GLOBAL_MAX_DOC_FREQ=maxDf||1;
  fsScale=d3.scalePow([1,GLOBAL_MAX_DOC_FREQ],[MIN_FS,MAX_FS]).exponent(0.35).clamp(true);
  KW_RE=new RegExp("\\b(?:"+[...allKw].sort((a,b)=>b.length-a.length).map(escapeRe).join("|")+")\\b","gi");

  path=[]; selectedEl=null; selKwText=null; pageOf.clear();
  panel.innerHTML=`<div class="empty">Click a keyphrase to see the grants it appears in.</div>`;

  document.getElementById("datasetLabel").textContent=entry.label||"";
  document.title=entry.label?`${entry.label} — Grant Topic Islands`:"Grant Topic Islands";

  updateTimelineLegend();
  render();
}

try{ await document.fonts.load('600 24px "Fira Sans"'); await document.fonts.load('500 18px "Fira Sans"'); }catch(e){}
await loadDataset(ENTRY);
