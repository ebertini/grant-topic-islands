<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant Topic Cards</title>
<style>
  :root {
    --surface-1:      #fcfcfb;
    --surface-2:      #f5f4f1;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #8a8a83;
    --hairline:       #e3e2dd;
    --nsf:  #2a78d6;
    --nih:  #008300;
    --other:#eda100;
    --accent:#2a78d6;
    --bar:  #cdd9e8;
    --bar-fill:#2a78d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--surface-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary); overflow: hidden; }
  #app { display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 48px 1fr; height: 100%; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; border-bottom: 1px solid var(--hairline); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .meta { font-size: 12px; color: var(--text-muted); }
  header .controls { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  label.ctl { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
  select, .btn { font: inherit; font-size: 12px; padding: 4px 9px; border: 1px solid var(--hairline);
    background: var(--surface-1); border-radius: 6px; color: var(--text-secondary); cursor: pointer; }
  .funder-group { display: flex; border: 1px solid var(--hairline); border-radius: 6px; overflow: hidden; }
  .funder-group .btn { border: none; border-radius: 0; }
  .funder-group .btn.on { background: var(--accent); color: #fff; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  #grid { grid-column: 1; grid-row: 2; overflow-y: auto; padding: 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px;
    align-content: start; }
  .card { display: flex; flex-direction: column; height: 380px; background: var(--surface-1);
    border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; }
  .card.dim { opacity: 0.32; }
  .card-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--hairline); }
  .card-title { font-size: 14.5px; font-weight: 650; line-height: 1.2; cursor: pointer; }
  .card-title:hover { color: var(--accent); }
  .card-title.sel { color: var(--accent); }
  .card-ctfidf { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-style: italic; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px;
    background: var(--surface-2); font-size: 10.5px; color: var(--text-secondary); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .toggle { margin-left: auto; }
  .card-body { flex: 1; overflow-y: auto; padding: 6px 14px 12px; }

  .sub { padding: 7px 0 6px; border-bottom: 1px solid var(--hairline); }
  .sub:last-child { border-bottom: none; }
  .sub-row { display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 5px;
    margin: 0 -6px; padding: 2px 6px; }
  .sub-row:hover { background: var(--surface-2); }
  .sub-row.sel .sub-label { color: var(--accent); }
  .sub-label { font-size: 12.5px; font-weight: 500; flex: 1; min-width: 0; }
  .sub-count { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .bar { width: 56px; height: 5px; border-radius: 3px; background: var(--bar); overflow: hidden; flex: none; }
  .bar > i { display: block; height: 100%; background: var(--bar-fill); border-radius: 3px; }
  .kws { display: none; flex-wrap: wrap; gap: 3px 9px; margin-top: 6px; padding-left: 2px; line-height: 1.35; }
  .card.open .kws { display: flex; }
  .kw { cursor: pointer; color: var(--text-primary); }
  .kw:hover { color: var(--accent); }
  .kw.sel { color: var(--accent); font-weight: 700; }
  .kw.fdim { opacity: 0.16; }

  #panel { grid-column: 2; grid-row: 2; border-left: 1px solid var(--hairline); background: var(--surface-1);
    padding: 14px 16px; overflow-y: auto; font-size: 13px; }
  #panel h2 { font-size: 14px; margin: 0 0 2px; }
  #panel .psub { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; }
  #panel .grant { padding: 8px 0; border-top: 1px solid var(--hairline); }
  #panel .grant .t { font-weight: 500; }
  #panel .grant .m { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
  #panel .empty { color: var(--text-muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Grant Topic Cards</h1>
    <span class="meta" id="meta"></span>
    <div class="controls">
      <label class="ctl">sort
        <select id="sort">
          <option value="score">by size</option>
          <option value="alpha">A–Z</option>
          <option value="funder">by funder</option>
        </select>
      </label>
      <span class="ctl">funder:</span>
      <div class="funder-group" id="funderFilter"></div>
      <button class="btn" id="researchOnly">Research only</button>
      <button class="btn" id="expandAll">Expand all</button>
    </div>
  </header>
  <div id="grid"></div>
  <aside id="panel"><div class="empty">Expand a card and click a keyphrase to see its grants.</div></aside>
</div>

<script type="module">
const NONRESEARCH = new Set(["t1", "t14", "t18"]);
const FUNDER_COLOR = { NSF: "var(--nsf)", NIH: "var(--nih)" };
const funderColor = f => FUNDER_COLOR[f] || "var(--other)";
const esc = s => (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const data = await fetch("../data/processed/topics.json").then(r => r.json());
const docs = data.docs || {};
document.getElementById("meta").textContent =
  `${data.meta.n_docs} grants · ${data.meta.n_topics} topics · ${data.meta.n_subtopics} subtopics · ${data.meta.n_keywords} keyphrases`;

const grid = document.getElementById("grid");
const panel = document.getElementById("panel");
const cardById = new Map();
let selectedEl = null;
// global normalization for the coverage bars (doc counts are absolute)
const gMaxSubDocs = Math.max(1, ...data.topics.flatMap(t => t.subtopics.map(s => s.doc_count)));

function keyphraseEl(k) {
  const wRange = k._wrange;
  const size = wRange[1] > wRange[0]
    ? 11 + ((k.weight - wRange[0]) / (wRange[1] - wRange[0])) * 7 : 13;
  const el = document.createElement("span");
  el.className = "kw";
  el.style.fontSize = size.toFixed(1) + "px";
  el.dataset.funder = k.funder;
  el.textContent = k.text;
  el.title = `${k.text} · ${k.doc_freq} grants · ${k.funder}`;
  el.onclick = () => selectKeyphrase(k, el);
  return el;
}

function buildCard(t) {
  const nKw = t.subtopics.reduce((a, s) => a + s.keywords.length, 0);
  const dom = Object.keys(t.funder_mix)[0];

  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = t.id;

  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML =
    `<div class="card-title" title="click for all ${t.doc_count} grants in this topic">${esc(t.llm_label)}</div>` +
    `<div class="card-ctfidf">${esc(t.label)}</div>` +
    `<div class="card-meta">` +
      `<span><strong>${t.doc_count}</strong> grants</span><span>·</span>` +
      `<span>${t.subtopics.length} subtopics</span><span>·</span><span>${nKw} keyphrases</span>` +
      `<span class="chip"><span class="dot" style="background:${funderColor(dom)}"></span>${dom}</span>` +
      `<button class="btn toggle">Show keyphrases</button>` +
    `</div>`;
  const titleEl = head.querySelector(".card-title");
  titleEl.onclick = () => selectTopic(t, titleEl);
  head.querySelector(".toggle").onclick = (e) => {
    const open = card.classList.toggle("open");
    e.target.textContent = open ? "Hide keyphrases" : "Show keyphrases";
  };

  const body = document.createElement("div");
  body.className = "card-body";
  for (const s of t.subtopics) {
    const wr = [Math.min(...s.keywords.map(k => k.weight)),
                Math.max(...s.keywords.map(k => k.weight))];
    const sub = document.createElement("div");
    sub.className = "sub";
    const row = document.createElement("div");
    row.className = "sub-row";
    row.title = `${s.doc_count} grants · ${s.keywords.length} keyphrases`;
    row.innerHTML =
      `<span class="sub-label">${esc(s.llm_label)}</span>` +
      `<span class="sub-count">${s.doc_count}</span>` +
      `<span class="bar"><i style="width:${Math.max(2, Math.round(s.doc_count / gMaxSubDocs * 100))}%"></i></span>`;
    row.onclick = () => selectSubtopic(s, row);
    const kws = document.createElement("div");
    kws.className = "kws";
    for (const k of s.keywords) { k._wrange = wr; kws.appendChild(keyphraseEl(k)); }
    sub.append(row, kws);
    body.appendChild(sub);
  }

  card.append(head, body);
  cardById.set(t.id, card);
  return card;
}

data.topics.forEach(t => grid.appendChild(buildCard(t)));

/* ---------- drill-down ---------- */
function setSel(el) {
  if (selectedEl) selectedEl.classList.remove("sel");
  selectedEl = el; el.classList.add("sel");
}
function showGrants(title, meta, docIds, total) {
  const grants = docIds.map(id => docs[id]).filter(Boolean)
    .sort((a, b) => (b.year || 0) - (a.year || 0));
  const shown = grants.slice(0, 80);
  total = total || grants.length;
  panel.innerHTML =
    `<h2>${esc(title)}</h2><div class="psub">${meta}` +
    (total > shown.length ? ` · showing ${shown.length} of ${total}` : "") + `</div>` +
    (shown.length ? shown.map(g =>
      `<div class="grant"><div class="t">${esc(g.title || "(untitled)")}</div>` +
      `<div class="m">${g.funder_code || "?"}${g.year ? " · " + g.year : ""}</div></div>`).join("")
     : `<div class="empty">No indexed grant metadata.</div>`);
}
function selectKeyphrase(k, el) {
  setSel(el);
  showGrants(k.text, `${k.doc_freq} grants · dominant funder ${k.funder}`, k.docs || [], k.doc_freq);
}
function selectSubtopic(s, el) {
  setSel(el);
  showGrants(s.llm_label, `${s.doc_count} grants · ${s.keywords.length} keyphrases`, s.docs || []);
}
function selectTopic(t, el) {
  setSel(el);
  const union = new Set();
  t.subtopics.forEach(s => (s.docs || []).forEach(d => union.add(d)));
  showGrants(t.llm_label, `${t.doc_count} grants · ${t.subtopics.length} subtopics`, [...union]);
}

/* ---------- sort ---------- */
const domFunder = t => Object.keys(t.funder_mix)[0];
document.getElementById("sort").onchange = function () {
  const mode = this.value;
  const order = [...data.topics].sort((a, b) =>
    mode === "alpha" ? a.llm_label.localeCompare(b.llm_label)
    : mode === "funder" ? (domFunder(a).localeCompare(domFunder(b)) || b.score - a.score)
    : b.score - a.score);
  order.forEach(t => grid.appendChild(cardById.get(t.id)));  // append reorders in place
};

/* ---------- funder facet ---------- */
let activeFunder = null;
const fg = document.getElementById("funderFilter");
["All", ...data.meta.funders].forEach(f => {
  const b = document.createElement("button");
  b.className = "btn" + (f === "All" ? " on" : "");
  b.textContent = f;
  b.onclick = () => {
    activeFunder = f === "All" ? null : f;
    fg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.textContent === f));
    applyFunder();
  };
  fg.appendChild(b);
});
function applyFunder() {
  data.topics.forEach(t => {
    const card = cardById.get(t.id);
    let match = 0;
    card.querySelectorAll(".kw").forEach(el => {
      const ok = !activeFunder || el.dataset.funder === activeFunder;
      el.classList.toggle("fdim", !ok);
      if (ok && activeFunder) match++;
    });
    card.classList.toggle("dim", !!activeFunder && match === 0);
  });
}

/* ---------- research-only ---------- */
document.getElementById("researchOnly").onclick = function () {
  const on = this.classList.toggle("on");
  NONRESEARCH.forEach(id => { cardById.get(id).style.display = on ? "none" : ""; });
};

/* ---------- expand all ---------- */
document.getElementById("expandAll").onclick = function () {
  const on = this.classList.toggle("on");
  this.textContent = on ? "Collapse all" : "Expand all";
  cardById.forEach(card => {
    card.classList.toggle("open", on);
    const tg = card.querySelector(".toggle");
    tg.textContent = on ? "Hide keyphrases" : "Show keyphrases";
  });
};
</script>
</body>
</html>
